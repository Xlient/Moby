openapi: 3.1.0
info:
  title: Disaster Early-Warning API
  version: 0.10.1
  description: >
    Contract v1. Region-aware by design; US is the only enabled region in v1.

    CHANGELOG
    0.10.1 — Ask Moby's search allowance (additive):
      + AskAnswer.search_limited: official websites would have been searched, but today's
        allowance for Ask Moby is used up (resets 00:00 UTC). Clients say so when abstained.
    0.10.0 — Trying Moby away from a disaster (additive):
      + GET /demo/hot-zones: today's busiest places (live alerts), each centred on its most
        serious alert, for the app to view from instead of the phone's position
      + GET /demo/replay: real past alerts moved to a point and dated now, for demo mode;
        never stored, pushed or listed by GET /alerts
      + Alert.demo, Alert.replay_of (set only on GET /demo/replay)
      + HotZone schema
    0.9.1 — SituationalBrief.timeline (additive): official and community events over time,
      built from the database when the brief is read.
    0.9.0 — "Before you go" trip briefing (additive):
      + POST /trips/brief (signed-in, 10 per hour): active official alerts whose area meets a
        circle around the destination, or a corridor along a route through 2-8 stops, and recent
        community reports in it (PostGIS), why each
        matters for the trip (NVIDIA Nemotron Ultra; every statement cites O/C/W ids and is
        checked), official web pages (Tavily) and a required, never-empty uncertainty list.
        Without the AI part (daily cap, no key) the same lists come back, labelled by ai_status
      + TripBriefRequest, TripBrief schemas
      + ClientConfig.flags.trip_briefing
    0.8.0 — Situational brief with citations and "what changed" (additive):
      + SituationalBrief.version, claims (each with basis official | community | news and
        the citation ids it rests on), contradictions, citations, changes, changes_since
      ~ SituationalBrief.sources stays a list of strings (URLs or source names)
    0.7.0 — Bluetooth mesh relay is implemented (additive):
      + POST /mesh/sync: rejected[].reason codes (unknown_hazard_type, unknown_severity,
        bad_location, too_many_hops, in_the_future, too_old, rate_limited,
        gateway_rate_limited); a mesh copy of a report is merged with the full report
        when the reporter's own phone sends it (same client_event_id → same event_id)
      + GET /mesh/alerts: official alerts only; radius_km max 300; records carry
        headline and expires_at for the gateway phone (they don't travel over the air)
      ~ MeshRecord: hazard_type and severity are indexes into HazardType and Severity;
        event_id for a report is sha256(client_event_id)[:8], hex
    0.6.0 — Community reports without a review gate (additive, no breaking changes):
      + AlertPreferences.community_reports (off | corroborated | all; default corroborated):
        which unverified community reports a user sees and gets pushed. Always labelled.
      + GET /alerts, /alerts/areas: community_reports (same default as the preference);
        min_tier now applies to official alerts only
      + Alert.reports_disagree (people nearby reported different severities; the alert
        uses the highest)
      ~ Alert.corroboration_count is also set on unverified community reports (1)
    0.5.0 — Reports are write-first (fusion runs after the 202):
      ~ ReportAccepted: event_id and tier are now optional (set once fusion has run);
        + report_id, + status (pending | fused | failed)
      + GET /reports/{client_event_id} (the reporter's own report status)
      + 409 on POST /reports when the client_event_id belongs to another reporter; 429 when rate limited
    0.4.0 — Additive only, no breaking changes (per-user alert preferences, marine alerts):
      + AlertPreferences schema; User.alert_preferences
      + PUT /me/alert-preferences
      + GET /alerts: hazard_types, min_severity, include_marine (default to the caller's
        saved preferences when signed in)
      + Alert.product, Alert.marine
    0.3.0 — Additive only, no breaking changes (fields the mobile alert card needs):
      + Alert.hazard_type          (drives the card's hazard icon)
      + Alert.location_name        (place shown in the card's metadata line)
      + Alert.corroboration_count  ("Confirmed by N nearby" on corroborated reports)
    0.2.0 — Additive only, no breaking changes:
      + GET /events/{id}/brief        (Ultra situational brief, async)
      + GET /regions/{region}/cascade (Ultra cascade analysis)
      + GET /guidance/manifest        (offline card sync)
      + GET /guidance/cards
      + GET /config                   (feature flags — supports flag discipline)
      + Event.brief_status
    0.1.0 — Initial frozen contract.

servers:
  - url: https://api.example.dev/v1
    description: Development

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: reports
  - name: alerts
  - name: analysis
  - name: guidance
  - name: subscriptions
  - name: mesh
  - name: review
  - name: config

paths:

  # ---------- config ----------

  /config:
    get:
      tags: [config]
      security: []
      summary: Client feature flags and runtime config
      description: >
        Clients MUST gate post-core features on these flags rather than shipping
        them unconditionally. Supports the feature-flag discipline in the plan:
        a half-built feature is flagged off, not half-shown.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientConfig' }

  # ---------- demo ----------

  /demo/hot-zones:
    get:
      tags: [demo]
      security: []
      summary: Today's hot zones
      description: >
        Places with the most going on right now (active alerts first reported or updated in
        the last 24 hours; marine products and single unconfirmed reports left out), best
        first: more kinds of hazard, more serious warnings and community reports rank above
        sheer volume. Cached for about 10 minutes.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [zones, generated_at]
                properties:
                  zones:
                    type: array
                    items: { $ref: '#/components/schemas/HotZone' }
                  generated_at: { type: string, format: date-time }

  /demo/replay:
    get:
      tags: [demo]
      security: []
      summary: Real past alerts, replayed around a point (demo mode)
      description: >
        Up to five real past alerts (the most serious official one on the point, so the
        person is inside it; the others a few km away), dated now and marked demo, with
        replay_of saying what each really was. Nothing is stored, pushed or shown to anyone
        else. event_id is the real event, so its explanation and brief still open.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double } }
        - { name: lon, in: query, required: true, schema: { type: number, format: double } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }

  # ---------- auth ----------

  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: Create a user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, home_region]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                display_name: { type: string, maxLength: 64 }
                home_region: { $ref: '#/components/schemas/RegionCode' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Exchange credentials for tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Refresh an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    get:
      tags: [auth]
      summary: Current user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /me/alert-preferences:
    get:
      tags: [auth]
      summary: The caller's alert preferences (defaults if never set)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPreferences' }
    put:
      tags: [auth]
      summary: Replace the caller's alert preferences
      description: >
        Applies to GET /alerts and to push delivery alike, so what a user sees and what
        notifies them never disagree. An empty hazard_types list is treated as "all".
        Critical alerts bypass these preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertPreferences' }
      responses:
        '200':
          description: Saved (normalized) preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /me/devices:
    post:
      tags: [auth]
      summary: Register a push token for this device
      description: >
        push_provider is explicit rather than inferred so non-FCM regions can be
        added later without a contract change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, push_provider, push_token, platform]
              properties:
                device_id: { type: string, description: Stable client-generated UUID }
                push_provider: { type: string, enum: [fcm, apns] }
                push_token: { type: string }
                platform: { type: string, enum: [ios, android] }
                language: { type: string, maxLength: 16, description: "Phone language tag (e.g. es-MX). Moby's AI text is translated into it when supported; English otherwise (push text)" }
      responses:
        '204': { description: Registered }

  /me/devices/{device_id}:
    delete:
      tags: [auth]
      summary: Stop push to this device (called on sign-out)
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed (or was not registered) }

  /me/near-me:
    put:
      tags: [subscriptions]
      summary: Set the area around the phone, for push
      description: >
        Kept by the app in step with the device position and the Home radius, so
        notifications match what Home lists. Stored at ~1 km precision (2 decimal
        places). Pushes for it start at medium severity; critical always gets through.
        Never appears in GET /subscriptions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [center, radius_km]
              properties:
                center: { $ref: '#/components/schemas/GeoPoint' }
                radius_km: { type: number, maximum: 500 }
      responses:
        '204': { description: Saved }
    delete:
      tags: [subscriptions]
      summary: Stop push for the area around the phone
      responses:
        '204': { description: Removed }

  # ---------- reports ----------

  /reports:
    post:
      tags: [reports]
      summary: Submit a manual ground report
      description: >
        Written to storage before processing, so a 202 means durably received.
        client_event_id is the idempotency key — retries are safe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportSubmission' }
      responses:
        '202':
          description: >
            Durably received (or already received — same client_event_id). Fusion runs
            afterwards; poll GET /reports/{client_event_id} for the outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: client_event_id already used by a different reporter
        '429':
          description: Too many reports from this reporter; retry later

  /reports/{client_event_id}:
    get:
      tags: [reports]
      summary: Status of one of the caller's own reports
      parameters:
        - name: client_event_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{event_id}:
    get:
      tags: [reports]
      summary: Fused event detail
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{event_id}/reports:
    get:
      tags: [reports]
      summary: Community reports fused into an event (public, coarse)
      description: >
        For the alert detail screen. Never includes notes, reporter identity or exact
        positions — only distance from the event, rounded to 100 m.
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventReports' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{event_id}/explain:
    get:
      tags: [analysis]
      summary: '"What this means for you": a plain-language explanation of an official warning'
      description: >
        Written by NVIDIA Nemotron Super from the agency's own text only, then checked: every
        number must appear in the original, and actions must come from the warning itself.
        200 when ready; 202 while it's being written (the first viewer triggers it, then it's
        cached); 404 when there is nothing to explain or it failed the checks. Clients must label
        it as Moby's AI explanation and keep the official text visible.
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
        - name: lang
          in: query
          required: false
          description: "Phone language tag (e.g. es-MX). Moby's AI text is translated into it when supported; English otherwise"
          schema: { type: string, maxLength: 16 }
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertExplanation' }
        '202':
          description: Being written
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending] }
                  retry_after_seconds: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /ask:
    post:
      tags: [analysis]
      summary: Ask Moby, a safety assistant that answers only from sources it can cite
      description: >
        Sources: active official alerts near the given point, Moby's guidance cards (retrieved
        with Qwen3 embeddings), and, when those don't cover it, the country's official websites
        via Tavily (searched with a generic query that NVIDIA Nemotron Nano rewrites to drop
        personal details). NVIDIA Nemotron Super answers with citations; the answer is withheld
        (abstained = true) if it isn't grounded in the sources it cites. Questions are not
        stored. Signed-in only; 20 questions per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskRequest' }
      responses:
        '200':
          description: An answer, or abstained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AskAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Too many questions }
        '503': { description: Ask Moby isn't available right now }

  /trips/brief:
    post:
      tags: [analysis]
      summary: '"Before you go": a trip briefing for a destination, to save for offline'
      description: >
        Code decides, AI explains. PostGIS selects the active official alerts whose area (or
        point) is within radius_km of the destination and the community reports there from the
        last 72 hours. NVIDIA Nemotron Ultra then explains why each matters for the trip; every
        statement cites the rows (O1…, C1…) or official web pages (W1…, Tavily, restricted to
        the country's official domains) it rests on, and is dropped if its numbers, names or
        hazards aren't in them. Statements resting on community reports have basis community
        and are shown as unverified. Never changes tier, severity or delivery. The destination
        is snapped to 0.01° and isn't stored with the caller's identity; the AI part is cached
        per snapped point, radius, trip and day, and redone when an alert or report changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripBriefRequest' }
      responses:
        '200':
          description: The briefing (always; ai_status says whether the AI part is included)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripBrief' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Invalid destination, radius or dates }
        '429': { description: Too many briefings }

  /events/{event_id}/confirm:
    post:
      tags: [reports]
      summary: Confirm or deny an existing event (proximity prompt response)
      description: >
        Binary response tied to an existing event rather than a new report, so
        confirmations never spawn duplicate look-alike events. observed_at_location
        indicates the responder actually reached the reported coordinates — a
        negative response only carries downgrade weight when this is true.
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response, observed_at_location, observed_at]
              properties:
                response: { type: string, enum: [confirm, deny, unsure] }
                observed_at_location: { type: boolean }
                observed_at: { type: string, format: date-time }
                location: { $ref: '#/components/schemas/GeoPoint' }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------- analysis (Ultra, async) ----------

  /events/{event_id}/brief:
    get:
      tags: [analysis]
      summary: Situational brief for an event
      description: >
        Generated asynchronously on Ultra after the fast alert has already been sent.
        Returns 202 with status "pending" while generation is in flight — clients
        should render the alert immediately and let the brief arrive behind it.
        Never block alert display on this endpoint. Opening an event asks for a brief
        when community reports arrived that the current brief doesn't cover: with no
        brief yet the response is 202; with one, the current brief is returned (200)
        and the rewrite follows.
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Brief ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SituationalBrief' }
        '202':
          description: Generation in flight
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending] }
                  retry_after_seconds: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /regions/{region}/cascade:
    get:
      tags: [analysis]
      summary: Active compound-hazard assessment for a region
      description: >
        Ultra reasons across all active regional events to detect cascading systems
        (quake to landslide to river dam to flood) that no single-event view surfaces.
        Only produced when a region has 2+ active events above Tier 0; otherwise 204.
      parameters:
        - name: region
          in: path
          required: true
          schema: { $ref: '#/components/schemas/RegionCode' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CascadeAssessment' }
        '204': { description: No active cascade assessment for this region }

  # ---------- guidance (offline) ----------

  /guidance/manifest:
    get:
      tags: [guidance]
      summary: Manifest of available guidance card bundles
      description: >
        Clients sync bundles while connected so cards remain readable with zero
        signal. Compare local content_hash against the manifest to decide what to
        re-download. Cards are authored by Ultra from official sources.
      parameters:
        - name: region
          in: query
          schema: { $ref: '#/components/schemas/RegionCode' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundles:
                    type: array
                    items: { $ref: '#/components/schemas/GuidanceBundle' }

  /guidance/cards:
    get:
      tags: [guidance]
      summary: Guidance cards for a region and hazard
      parameters:
        - name: region
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RegionCode' }
        - name: hazard_type
          in: query
          schema: { $ref: '#/components/schemas/HazardType' }
        - name: bundle_version
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items: { $ref: '#/components/schemas/GuidanceCard' }

  # ---------- alerts ----------

  /alerts:
    get:
      tags: [alerts]
      summary: Active alerts
      description: >
        Returns Tier 2 (public) alerts by default. Lower tiers are visible only to
        reviewers, or to subscribers who opt into early/unverified signals.
      parameters:
        - name: region
          in: query
          schema: { $ref: '#/components/schemas/RegionCode' }
        - name: lat
          in: query
          schema: { type: number, format: double }
        - name: lon
          in: query
          schema: { type: number, format: double }
        - name: radius_km
          in: query
          schema: { type: number, default: 50, maximum: 500 }
        - name: min_tier
          in: query
          description: Minimum tier for official alerts. Community reports follow community_reports.
          schema: { type: integer, enum: [0, 1, 2], default: 2 }
        - name: community_reports
          in: query
          description: >
            Which community reports to include: off (none), corroborated (reported by 2+
            different people), all (single reports too). Defaults to the caller's saved
            preferences, else corroborated.
          schema: { type: string, enum: [off, corroborated, all] }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: hazard_types
          in: query
          description: Only these hazard types. Defaults to the caller's saved preferences, else all.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/HazardType' }
        - name: min_severity
          in: query
          description: Defaults to the caller's saved preferences, else low.
          schema: { $ref: '#/components/schemas/Severity' }
        - name: include_marine
          in: query
          description: Include marine (offshore/boating) products. Defaults to the caller's saved preferences, else false.
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }

  /alerts/areas:
    get:
      tags: [alerts]
      summary: Warning areas of the alerts near a point, for the map
      description: >
        Same alerts and filters as GET /alerts, as a GeoJSON FeatureCollection of their
        areas (simplified ~500 m). Alerts without an area (e.g. most earthquakes) are not
        included. Feature properties: alert_id, severity, hazard_type.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lon, in: query, required: true, schema: { type: number } }
        - { name: radius_km, in: query, schema: { type: number, maximum: 500 } }
      responses:
        '200':
          description: OK
          content:
            application/geo+json:
              schema:
                type: object
                required: [type, features]
                properties:
                  type: { type: string, enum: [FeatureCollection] }
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [Feature] }
                        id: { type: string }
                        geometry: { type: object }
                        properties:
                          type: object
                          properties:
                            alert_id: { type: string }
                            severity: { $ref: '#/components/schemas/Severity' }
                            hazard_type: { $ref: '#/components/schemas/HazardType' }

  /alerts/{alert_id}:
    get:
      tags: [alerts]
      summary: Alert detail
      parameters:
        - name: alert_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------- subscriptions ----------

  /subscriptions:
    get:
      tags: [subscriptions]
      summary: List region subscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Subscription' }
    post:
      tags: [subscriptions]
      summary: Subscribe to an area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region, center, radius_km]
              properties:
                region: { $ref: '#/components/schemas/RegionCode' }
                label: { type: string, maxLength: 64 }
                center: { $ref: '#/components/schemas/GeoPoint' }
                radius_km: { type: number, maximum: 500 }
                min_severity:
                  type: string
                  enum: [low, medium, high, critical]
                  default: medium
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

  /subscriptions/{subscription_id}:
    delete:
      tags: [subscriptions]
      summary: Remove a subscription
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }

  # ---------- mesh ----------

  /mesh/sync:
    post:
      tags: [mesh]
      summary: Upload mesh-relayed records from a gateway device
      description: >
        Idempotent on event_id. A repeated event_id is never a duplicate event — it
        either no-ops or adds a relay hash to the existing record. Safe to retry
        until acknowledged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, records]
              properties:
                device_id: { type: string }
                records:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/MeshRecord' }
      responses:
        '200':
          description: Sync result — acked ids may be cleared from the local queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged:
                    type: array
                    items: { type: string }
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        event_id: { type: string }
                        reason: { type: string }

  /mesh/alerts:
    get:
      tags: [mesh]
      summary: Active alerts in compact form for mesh injection
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: lon
          in: query
          required: true
          schema: { type: number, format: double }
        - name: radius_km
          in: query
          schema: { type: number, default: 100, maximum: 300 }
      responses:
        '200':
          description: OK (official alerts only, most severe first, at most 20)
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/MeshRecord' }
                        - type: object
                          properties:
                            headline: { type: string, description: For the gateway phone only; not sent over the air }
                            expires_at: { type: string, format: date-time }

  # ---------- review ----------

  /routes/check:
    post:
      tags: [routes]
      summary: Does a route cross a hazard Moby knows about? And one that goes around
      description: >
        The usual route from OpenRouteService (OpenStreetMap), the active hazards it
        crosses (official warnings with an area; community events from tier 1, as 500 m
        circles), and, when it crosses any, a route that avoids them, checked the same way.
        Never says a route is safe: only that it crosses no hazard Moby knows about.
        Only the two points go to OpenRouteService. Capped per day (429 daily_limit);
        503 routing_unavailable when the server has no ORS key; 422 with no_route,
        point_not_routable or over_limits when ORS can't route these points.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteCheckRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteCheck' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /routes/places:
    get:
      tags: [routes]
      summary: Place search for a route's destination
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 }, description: Bias results towards here }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/Place' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /review/queue:
    get:
      tags: [review]
      summary: Events awaiting human review
      description: Reviewer role required. Severity-floor items sort first.
      parameters:
        - name: region
          in: query
          schema: { $ref: '#/components/schemas/RegionCode' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReviewItem' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /review/sos:
    get:
      tags: [review]
      summary: SOS calls relayed over the Bluetooth mesh
      description: >
        Reviewer role required. One row per sender (daily-rotating mesh id): their latest
        call for help, how many times they sent it, and when they said they're safe, if
        they did. Nobody has checked these, and Moby forwards them nowhere: the reviewer
        decides whether to contact emergency services. Kept 30 days.
      parameters:
        - name: hours
          in: query
          schema: { type: integer, minimum: 1, maximum: 72, default: 24 }
      responses:
        '200':
          description: OK, newest call first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SosSignal' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /review/{event_id}/decision:
    post:
      tags: [review]
      summary: Approve, reject, or hold an event
      description: >
        Records the decision (review_queue.status = decided, events.reviewer_decision).
        The fusion pipeline then resumes its paused checkpoint for this event.
        409 if another reviewer already decided it.
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject, hold] }
                note: { type: string, maxLength: 500 }
                override_severity:
                  type: string
                  enum: [low, medium, high, critical]
      responses:
        '204': { description: Recorded }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already decided by another reviewer

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    ClientConfig:
      type: object
      required: [flags, min_supported_client]
      properties:
        min_supported_client: { type: string }
        flags:
          type: object
          description: >
            Post-core features. Clients gate UI on these. Absent or false means
            the feature is not shown at all — never partially rendered.
          properties:
            situational_brief: { type: boolean, default: false }
            cascade_analysis: { type: boolean, default: false }
            offline_guidance_cards: { type: boolean, default: false }
            on_device_assistant: { type: boolean, default: false }
            ask_moby: { type: boolean, default: false, description: 'POST /ask is available (Token Factory configured)' }
            mesh_relay: { type: boolean, default: false }
            proximity_confirmation: { type: boolean, default: false }
            early_tier_opt_in: { type: boolean, default: false }
            trip_briefing: { type: boolean, default: false, description: 'POST /trips/brief ("Before you go") is available' }

    RegionCode:
      type: string
      description: >
        Enabled regions. v1 ships US only; CN is reserved and rejected at runtime
        until its feed, coordinate-frame and push work lands. Exception: guidance
        (/guidance/manifest, /guidance/cards) already serves CN bundles: English cards
        from Chinese agencies' pages, for people in China.
      enum: [US, CN]

    CoordinateFrame:
      type: string
      description: >
        Declared per region so clients never assume WGS-84. v1 is always WGS84.
      enum: [WGS84, GCJ02]

    GeoPoint:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lon: { type: number, format: double, minimum: -180, maximum: 180 }
        accuracy_m: { type: number }
        frame:
          allOf: [{ $ref: '#/components/schemas/CoordinateFrame' }]
          default: WGS84

    HazardType:
      type: string
      enum: [flood, fire, earthquake, storm, landslide, other]

    ObservedEffect:
      type: string
      description: Controlled vocabulary — lets fusion match reports of the same phenomenon.
      enum:
        - rising_water
        - structural_damage
        - smoke_or_fire_visible
        - ground_shaking
        - blocked_road
        - other

    Severity:
      type: string
      enum: [low, medium, high, critical]

    SourceType:
      type: string
      enum: [official, manual, mesh]

    AuthTokens:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Seconds }

    User:
      type: object
      required: [user_id, email, roles, home_region]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        roles:
          type: array
          items: { type: string, enum: [subscriber, reporter, reviewer, admin] }
        home_region: { $ref: '#/components/schemas/RegionCode' }
        created_at: { type: string, format: date-time }
        alert_preferences: { $ref: '#/components/schemas/AlertPreferences' }

    AlertPreferences:
      type: object
      description: >
        What a user wants to be alerted about. Defaults: every hazard type, every
        severity, marine off (marine products are ~70% of NWS alerts and only matter
        on the water). Critical alerts are always delivered: these preferences only
        ever filter lower severities, never a critical alert within the user's radius.
      properties:
        hazard_types:
          type: array
          description: Empty or absent means all.
          items: { $ref: '#/components/schemas/HazardType' }
        min_severity:
          allOf: [{ $ref: '#/components/schemas/Severity' }]
          default: low
        include_marine:
          type: boolean
          default: false
        community_reports:
          type: string
          enum: [off, corroborated, all]
          default: corroborated
          description: >
            Which reports from people nearby (never confirmed by an agency) to see and be
            notified about: off, corroborated (2+ different people), or all (single reports
            too). Always shown labelled as unverified. Applies to critical ones too: this is
            a choice about trust, not severity.

    ReportSubmission:
      type: object
      required: [client_event_id, hazard_type, severity, location, observed_at]
      properties:
        client_event_id:
          type: string
          description: Client-generated UUID. Idempotency key — safe to retry.
        hazard_type: { $ref: '#/components/schemas/HazardType' }
        observed_effect: { $ref: '#/components/schemas/ObservedEffect' }
        severity: { $ref: '#/components/schemas/Severity' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        observed_at: { type: string, format: date-time }
        note:
          type: string
          maxLength: 1000
          description: Free text. Parsed by the structuring agent; never relayed over mesh.
        captured_offline:
          type: boolean
          default: false
          description: True if queued on-device before connectivity returned.

    ReportAccepted:
      type: object
      required: [client_event_id, report_id, status]
      properties:
        client_event_id: { type: string }
        report_id: { type: string }
        status:
          type: string
          enum: [pending, fused, failed]
          description: pending until the fusion pipeline has processed the report.
        event_id: { type: string, description: Fused event this report was attached to (once fused) }
        tier: { type: integer, enum: [0, 1, 2], description: The event's tier (once fused) }
        merged_into_existing: { type: boolean }

    Event:
      type: object
      required: [event_id, source, hazard_type, severity, location, tier, confidence]
      properties:
        event_id: { type: string }
        source: { $ref: '#/components/schemas/SourceType' }
        region: { $ref: '#/components/schemas/RegionCode' }
        hazard_type: { $ref: '#/components/schemas/HazardType' }
        observed_effect: { $ref: '#/components/schemas/ObservedEffect' }
        severity: { $ref: '#/components/schemas/Severity' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        first_reported_at: { type: string, format: date-time }
        last_updated_at: { type: string, format: date-time }
        tier:
          type: integer
          enum: [0, 1, 2]
          description: 0 unverified, 1 corroborated, 2 confirmed (public alert)
        confidence: { type: number, minimum: 0, maximum: 1 }
        specificity_score: { type: number, minimum: 0, maximum: 1 }
        distinct_reporter_count:
          type: integer
          description: Distinct originators only — relay hops never increment this.
        confirm_count: { type: integer }
        deny_count: { type: integer }
        official_match_id:
          type: string
          nullable: true
          description: Matching NOAA/USGS/EONET/GDACS event, if any.
        reviewer_decision:
          type: string
          nullable: true
          enum: [approve, reject, hold]
        brief_status:
          type: string
          description: Situational brief generation state. Clients never block on this.
          enum: [not_requested, pending, ready, failed]
          default: not_requested
        verification_label:
          type: string
          description: Shown verbatim in UI — unverified reports must never render as official.
          enum: [unverified_report, corroborated_report, official_confirmed]

    Alert:
      type: object
      required: [alert_id, event_id, headline, severity, issued_at, verification_label]
      properties:
        alert_id: { type: string }
        event_id: { type: string }
        headline: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 600 }
        severity: { $ref: '#/components/schemas/Severity' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        affected_radius_km: { type: number }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        verification_label:
          type: string
          enum: [unverified_report, corroborated_report, official_confirmed]
        source_attribution:
          type: string
          description: e.g. "NOAA/NWS" or "Community reports"
        hazard_type:
          $ref: '#/components/schemas/HazardType'
          description: Same value as the fused Event. Clients fall back to a generic icon when absent.
        location_name:
          type: string
          maxLength: 80
          description: >
            Human-readable place for the alert's location, e.g. "Russian River Basin".
            Shown beside distance and time; never repeated in the headline.
        corroboration_count:
          type: integer
          minimum: 0
          description: >
            Distinct originating reporters behind a community report (relay hops and
            repeat reports from one device do not count — see escalation caution rules).
            Omitted for official_confirmed; 1 for unverified_report.
        reports_disagree:
          type: boolean
          description: >
            Community reports only: people nearby reported different severities. The alert
            uses the highest one (a missed danger is worse than an over-warning).
        product:
          type: string
          description: >
            The source's own product name, e.g. "Flood Warning", "Small Craft Advisory",
            "earthquake". Finer-grained than hazard_type.
        marine:
          type: boolean
          description: Offshore/boating product; absent means false. Hidden unless the user opts in.
        country:
          type: string
          description: ISO 3166-1 alpha-2 of the issuing authority or event, when known (e.g. for emergency numbers).
        translated:
          type: boolean
          description: >
            headline/body are Moby's machine translation into English (issue #11). Clients
            MUST label it ("Translated by Moby") and offer the original. Absent = the agency's own words.
        original_language:
          type: string
          description: Language the agency wrote in, e.g. "Spanish". Present when translated.
        original_headline: { type: string, description: The agency's own headline. Present when translated. }
        original_body: { type: string, description: The agency's own text. Present when translated. }
        distance_km:
          type: number
          description: >
            GET /alerts only: distance from the query point to the alert, in km. Measured to
            the alert's area when it has one, so 0 means "you are inside it".
        demo:
          type: boolean
          description: >
            GET /demo/replay only: a real past alert replayed for demo mode. Clients MUST label
            it as a demo and never treat it as a current warning (push, mesh, sharing).
        replay_of:
          type: object
          description: GET /demo/replay only. When and where the alert really was.
          required: [issued_at]
          properties:
            issued_at: { type: string, format: date-time }
            location_name: { type: string }

    HotZone:
      type: object
      required: [zone_id, name, center, alert_count, hazard_types, top_severity, has_community_reports, lead_headline]
      properties:
        zone_id: { type: string }
        name: { type: string, description: The lead alert's place, e.g. "Metro Manila". }
        country: { type: string, description: ISO 3166-1 alpha-2, when known. }
        center: { $ref: '#/components/schemas/GeoPoint' }
        alert_count: { type: integer }
        hazard_types:
          type: array
          description: Most common first.
          items: { $ref: '#/components/schemas/HazardType' }
        top_severity: { $ref: '#/components/schemas/Severity' }
        has_community_reports: { type: boolean }
        lead_headline: { type: string }

    EventReports:
      type: object
      required: [event_id, distinct_reporter_count, reports]
      properties:
        event_id: { type: string }
        distinct_reporter_count:
          type: integer
          description: Distinct people behind the reports (repeat reports from one person count once).
        reports:
          type: array
          description: Newest first, at most 50.
          items: { $ref: '#/components/schemas/ReportSummary' }

    ReportSummary:
      type: object
      required: [hazard_type, severity, observed_at, distance_from_event_m]
      properties:
        hazard_type: { $ref: '#/components/schemas/HazardType' }
        observed_effect: { $ref: '#/components/schemas/ObservedEffect' }
        severity: { $ref: '#/components/schemas/Severity' }
        observed_at: { type: string, format: date-time }
        distance_from_event_m: { type: integer, description: Rounded to 100 m. }
        captured_offline: { type: boolean }
        via_mesh: { type: boolean, description: Arrived over the Bluetooth mesh. }

    AlertExplanation:
      type: object
      required: [event_id, summary, actions, model]
      properties:
        event_id: { type: string }
        summary: { type: string, description: 2-3 plain sentences grounded in the agency's text }
        actions:
          type: array
          maxItems: 3
          items: { type: string }
          description: Instructions taken from the warning itself (empty if it gives none)
        model: { type: string, description: e.g. nvidia/nemotron-3-super-120b-a12b }
        generated_at: { type: string, format: date-time }
        language: { type: string, description: "Language of summary and actions (ISO 639-1); 'en' unless translated by Moby" }

    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 3, maxLength: 500 }
        lat: { type: number, minimum: -90, maximum: 90, description: Optional; adds nearby official alerts as sources }
        lon: { type: number, minimum: -180, maximum: 180 }
        country: { type: string, pattern: '^[A-Z]{2}$', description: Picks the official websites to search }
        language: { type: string, maxLength: 16, description: "Phone language tag (e.g. es-MX). Moby's AI text is translated into it when supported; English otherwise" }

    AskAnswer:
      type: object
      required: [abstained, sources, model, searched_web]
      properties:
        answer:
          type: string
          nullable: true
          description: Plain-language answer with [n] markers matching sources; null when abstained
        abstained: { type: boolean }
        sources:
          type: array
          items:
            type: object
            required: [n, kind, title, publisher]
            properties:
              n: { type: integer }
              kind: { type: string, enum: [alert, guidance, web] }
              title: { type: string }
              publisher: { type: string }
              url: { type: string, nullable: true }
        model: { type: string }
        searched_web: { type: boolean, description: True when official websites were searched via Tavily }
        search_limited:
          type: boolean
          description: >
            True when official websites would have been searched but Ask Moby's daily search
            allowance is used up (it resets at 00:00 UTC). The answer, if any, comes from alerts
            and guidance only. Clients should say so when abstained is true.
        language: { type: string, description: "Language of the answer (ISO 639-1); 'en' unless translated by Moby" }

    TripBriefRequest:
      type: object
      description: A destination (lat + lon) or a route (stops), not both.
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        stops:
          type: array
          minItems: 2
          maxItems: 8
          description: >
            A route, in order. Checked as straight lines between the stops (not the actual trail),
            with radius_km on either side; at most 500 km in total.
          items: { $ref: '#/components/schemas/TripStop' }
        radius_km: { type: number, minimum: 1, maximum: 100, default: 25 }
        start_date: { type: string, format: date, description: 'Default today (UTC); yesterday to a year ahead' }
        end_date: { type: string, format: date, description: 'Default start_date + 3 days; at most 30 days after it' }
        country: { type: string, pattern: '^[A-Z]{2}$', description: Picks the official websites to search; else taken from the alerts }
        place_name: { type: string, maxLength: 80, description: "The place picked from the app's list (used in the web search and the text)" }

    TripStop:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        name: { type: string, maxLength: 80, description: "The place picked from the app's list" }

    TripBrief:
      type: object
      required: [generated_at, destination, trip, official_alerts, community_reports, hazards, web_sources,
                 searched_web, web_status, ai_status, cached, uncertainty, language]
      properties:
        generated_at: { type: string, format: date-time }
        destination:
          type: object
          required: [lat, lon, radius_km]
          properties:
            lat: { type: number, description: Snapped to 0.01° }
            lon: { type: number }
            radius_km: { type: number }
            place_name: { type: string }
            country: { type: string }
        route:
          type: object
          description: Present for a route; destination is then its last stop.
          required: [stops, length_km]
          properties:
            stops:
              type: array
              items: { $ref: '#/components/schemas/TripStop' }
            length_km: { type: number, description: Sum of the straight legs between stops }
        trip:
          type: object
          required: [start_date, end_date]
          properties:
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
        official_alerts:
          type: array
          description: Most severe first, then nearest. Every one is an agency's alert.
          items:
            allOf:
              - $ref: '#/components/schemas/Alert'
              - type: object
                required: [cite_id, ends_before_trip]
                properties:
                  cite_id: { type: string, description: 'O1, O2…' }
                  ends_before_trip: { type: boolean, description: The alert expires before start_date }
                  near_stop: { type: string, description: Routes only, the stop it is nearest to }
        community_reports:
          type: array
          description: >
            Reports from people nearby (fused community events), last 72 hours. Never official:
            clients MUST show them as unverified and apart from official_alerts.
          items:
            allOf:
              - $ref: '#/components/schemas/Alert'
              - type: object
                required: [cite_id, reporter_count, last_report_at]
                properties:
                  cite_id: { type: string, description: 'C1, C2…' }
                  reporter_count: { type: integer, minimum: 1, description: Different people who reported it }
                  last_report_at: { type: string, format: date-time }
                  near_stop: { type: string, description: Routes only, the stop it is nearest to }
        hazards:
          type: array
          description: Hazard types found (for matching offline guidance cards)
          items: { $ref: '#/components/schemas/HazardType' }
        web_sources:
          type: array
          items:
            type: object
            required: [cite_id, title, url, publisher]
            properties:
              cite_id: { type: string, description: 'W1, W2…' }
              title: { type: string }
              url: { type: string }
              publisher: { type: string }
        searched_web: { type: boolean }
        web_status: { type: string, enum: [searched, no_official_sites, no_key, over_cap, failed] }
        explanation:
          type: object
          description: Absent unless ai_status is ok or partial.
          required: [model, claims]
          properties:
            model: { type: string, description: e.g. nvidia/Nemotron-3-Ultra-550b-a55b }
            claims:
              type: array
              items:
                type: object
                required: [text, basis, cites]
                properties:
                  text: { type: string }
                  basis:
                    type: string
                    enum: [official, community]
                    description: community when any cited source is a community report; show as unverified
                  cites:
                    type: array
                    items: { type: string, description: 'O1, C1 or W1' }
        ai_status:
          type: string
          enum: [ok, partial, withheld, over_cap, unavailable, nothing_to_explain]
          description: >
            ok / partial (some statements failed their checks and were dropped); withheld (none
            passed); over_cap (daily limit); unavailable (no model); nothing_to_explain (no rows).
            Without explanation, label the lists as not written by AI.
        cached: { type: boolean, description: The AI part and web results came from the cache }
        uncertainty:
          type: array
          minItems: 1
          description: >
            Required, never empty. What the briefing can't tell you, including that a saved copy
            goes stale. Clients MUST display it.
          items: { type: string }
        language: { type: string }

    SituationalBrief:
      type: object
      required: [event_id, generated_at, model, summary, uncertainty]
      properties:
        event_id: { type: string }
        generated_at: { type: string, format: date-time }
        model: { type: string, description: e.g. nemotron-3-ultra }
        summary:
          type: string
          description: What is likely happening, in plain language.
        likely_progression:
          type: string
          description: Plausible near-term development. Explicitly an estimate.
        exposed_areas:
          type: array
          description: Downstream or adjacent areas that may be affected.
          items:
            type: object
            properties:
              description: { type: string }
              location: { $ref: '#/components/schemas/GeoPoint' }
              rationale: { type: string }
        official_guidance:
          type: string
          description: Guidance drawn from matched official sources, attributed.
        uncertainty:
          type: string
          description: >
            Required. What the brief does not know and where it may be wrong.
            Clients MUST display this — never render a brief as certainty.
        sources:
          type: array
          items: { type: string }
        version:
          type: integer
          minimum: 1
          description: Increases each time the brief is rewritten for this event.
        claims:
          type: array
          description: >
            The brief's statements, each tied to the citations it rests on. Clients label
            each by basis; a community claim is never shown as official.
          items:
            type: object
            required: [text, basis, evidence]
            properties:
              text: { type: string }
              basis: { type: string, enum: [official, community, news] }
              evidence:
                type: array
                items: { type: string, description: A citation id, e.g. O1, C2, W1 }
        contradictions:
          type: array
          description: Where reports or sources disagree.
          items: { type: string }
        citations:
          type: array
          items:
            type: object
            required: [id, title, kind]
            properties:
              id: { type: string, description: 'O1… official, C1… community, W1… web' }
              title: { type: string }
              url: { type: string }
              kind: { type: string, enum: [official, community, news] }
        changes:
          type: string
          description: >
            What changed since the previous version, in plain words. Absent on a first
            brief. Computed from a diff of the event's facts; the model only words it.
        changes_since:
          type: string
          format: date-time
          description: When the version that `changes` compares against was generated.
        timeline:
          type: array
          description: >
            Built from the database when the brief is read (not by the model), oldest first:
            the official warning (issued, updated, in force until) and one entry per thing
            people reported. after_brief marks what the brief doesn't cover yet.
          items:
            type: object
            required: [at, kind, type, label, after_brief]
            properties:
              at: { type: string, format: date-time }
              until: { type: string, format: date-time, description: Last report of a community group }
              kind: { type: string, enum: [official, community] }
              type: { type: string, enum: [issued, updated, expires, reports] }
              label: { type: string }
              detail: { type: string, description: The issuing agency (official entries) }
              reporters: { type: integer, description: Distinct people (community entries) }
              severity: { type: string, enum: [low, medium, high, critical] }
              times:
                type: array
                description: When each report in the group was observed (up to 20)
                items: { type: string, format: date-time }
              after_brief: { type: boolean }

    CascadeAssessment:
      type: object
      required: [region, generated_at, is_cascade, event_ids, reasoning]
      properties:
        region: { $ref: '#/components/schemas/RegionCode' }
        generated_at: { type: string, format: date-time }
        model: { type: string }
        is_cascade:
          type: boolean
          description: Whether active events appear to be one compound system.
        confidence: { type: number, minimum: 0, maximum: 1 }
        event_ids:
          type: array
          items: { type: string }
        chain:
          type: array
          description: Proposed causal ordering, if a cascade is detected.
          items:
            type: object
            properties:
              event_id: { type: string }
              role: { type: string, description: e.g. trigger, amplifier, consequence }
        reasoning: { type: string }
        uncertainty: { type: string }

    GuidanceBundle:
      type: object
      required: [bundle_id, region, version, content_hash, size_bytes, generated_at]
      properties:
        bundle_id: { type: string }
        region: { $ref: '#/components/schemas/RegionCode' }
        hazard_types:
          type: array
          items: { $ref: '#/components/schemas/HazardType' }
        version: { type: string }
        content_hash: { type: string, description: Compare against local copy to decide re-download }
        size_bytes: { type: integer }
        generated_at: { type: string, format: date-time }
        card_count: { type: integer }

    GuidanceCard:
      type: object
      required: [card_id, hazard_type, title, body, source_name, source_url, last_reviewed_at]
      properties:
        card_id: { type: string }
        hazard_type: { $ref: '#/components/schemas/HazardType' }
        applies_when:
          type: string
          description: Short condition string used for local retrieval matching.
        title: { type: string, maxLength: 120 }
        body:
          type: string
          description: >
            Actionable guidance traceable to the cited official source. Content is
            synthesized by Ultra from official material, not authored freely.
        priority:
          type: integer
          description: Lower is more urgent. Drives static fallback ordering.
        source_name: { type: string, description: 'The agency whose page the card is from, e.g. FEMA Ready.gov, National Weather Service, Ministry of Emergency Management (China). Cards are English even when the page is not.' }
        source_url: { type: string }
        last_reviewed_at:
          type: string
          format: date-time
          description: >
            MUST be displayed. Offline guidance goes stale and the user needs to see how old it is.
        is_critical_fallback:
          type: boolean
          default: false
          description: >
            Included in the hard-coded, model-independent fallback set. These render
            even if retrieval or the on-device model is unavailable.

    SosSignal:
      type: object
      required: [sos_id, sender, location, sent_at, received_at, hop_count, relay_count, help_count]
      properties:
        sos_id: { type: string, description: 8-byte mesh id of the latest call, hex }
        sender: { type: string, description: The sender's daily-rotating mesh id (not linked to an account) }
        location: { $ref: '#/components/schemas/GeoPoint' }
        sent_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time, description: When a phone with signal uploaded it }
        hop_count: { type: integer, description: Fewest phones it passed through to reach a phone with signal }
        relay_count: { type: integer, description: Phones that uploaded it }
        help_count: { type: integer, description: Calls for help from this sender in the window }
        safe_at: { type: [string, 'null'], format: date-time, description: When the sender said they're safe, if they did }
    RouteCheckRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: { $ref: '#/components/schemas/LatLon' }
        destination: { $ref: '#/components/schemas/LatLon' }
        profile: { type: string, enum: [driving-car, foot-hiking], default: driving-car }

    LatLon:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }

    Place:
      type: object
      required: [label, lat, lon]
      properties:
        label: { type: string }
        lat: { type: number }
        lon: { type: number }

    RouteCheck:
      type: object
      required: [profile, route]
      properties:
        profile: { type: string, enum: [driving-car, foot-hiking] }
        route: { $ref: '#/components/schemas/CheckedRoute' }
        alternative:
          oneOf: [{ $ref: '#/components/schemas/CheckedRoute' }, { type: 'null' }]
          description: A route around the hazards the usual one crosses; null when it crosses none or none was found
        alternative_problem:
          type: [string, 'null']
          enum: [cannot_avoid, no_route, over_limits, point_not_routable, rate_limited, not_configured, unreachable, routing_failed, null]
          description: Why there's no alternative although the route crosses hazards

    CheckedRoute:
      type: object
      required: [geometry, distance_m, duration_s, hazards]
      properties:
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type: { type: string, enum: [LineString] }
            coordinates:
              type: array
              items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
              description: '[lon, lat] pairs'
        distance_m: { type: integer }
        duration_s: { type: integer }
        hazards:
          type: array
          description: Hazards the route crosses, in the order you'd reach them
          items: { $ref: '#/components/schemas/RouteHazard' }

    RouteHazard:
      type: object
      required: [event_id, alert_id, hazard_type, severity, verification, km_along, at]
      properties:
        event_id: { type: string }
        alert_id: { type: string, description: 'Opens the alert (GET /alerts/{alert_id})' }
        hazard_type: { $ref: '#/components/schemas/HazardType' }
        severity: { $ref: '#/components/schemas/Severity' }
        verification: { type: string, enum: [official, community] }
        headline: { type: [string, 'null'] }
        km_along: { type: number, description: How far along the route you'd reach it }
        at: { $ref: '#/components/schemas/LatLon', description: The point on the route nearest the hazard }
        expires_at: { type: [string, 'null'], format: date-time }
        cannot_avoid:
          type: string
          enum: [start_inside, end_inside, too_large]
          description: Present when no route can avoid it (you start or end inside it, or it's too large to route around)

    MeshRecord:
      type: object
      description: >
        JSON mirror of the ~28-byte binary record relayed over BLE. The wire format
        is CBOR/packed-binary; this shape is only used at the gateway sync boundary.
      required: [event_id, hazard_type, lat_e6, lon_e6, severity, hop_count, timestamp, reporter_hash]
      properties:
        event_id: { type: string, description: '8 bytes, hex. Reports: sha256(client_event_id)[:8]' }
        hazard_type: { type: integer, minimum: 0, maximum: 255, description: 'Index into HazardType: 0 flood, 1 fire, 2 earthquake, 3 storm, 4 landslide, 5 other. 6 is an SOS (severity 3 = needs help, 0 = safe now), stored apart from reports (see /review/sos)' }
        lat_e6: { type: integer, description: Degrees times 1e6 (sent over the air rounded to 1e-4) }
        lon_e6: { type: integer, description: Degrees times 1e6 (sent over the air rounded to 1e-4) }
        severity: { type: integer, minimum: 0, maximum: 255, description: 'Index into Severity: 0 low, 1 medium, 2 high, 3 critical' }
        confidence: { type: integer, minimum: 0, maximum: 255 }
        hop_count: { type: integer, minimum: 0, maximum: 255 }
        timestamp: { type: integer, description: Unix epoch seconds }
        reporter_hash: { type: string, description: 4-byte anonymized originator, hex-encoded }
        relayed_by:
          type: array
          description: Relay hashes observed by this gateway. Never counted as corroboration.
          items: { type: string }

    Subscription:
      type: object
      required: [subscription_id, region, center, radius_km, min_severity]
      properties:
        subscription_id: { type: string }
        region: { $ref: '#/components/schemas/RegionCode' }
        label: { type: string }
        center: { $ref: '#/components/schemas/GeoPoint' }
        radius_km: { type: number }
        min_severity: { $ref: '#/components/schemas/Severity' }

    ReviewItem:
      type: object
      required: [event_id, event, queued_at, reason]
      properties:
        event_id: { type: string }
        event: { $ref: '#/components/schemas/Event' }
        queued_at: { type: string, format: date-time }
        reason:
          type: string
          enum: [tier1_corroborated, severity_floor, conflicting_reports, low_confidence]
        contributing_reports:
          type: array
          items: { $ref: '#/components/schemas/ReportSubmission' }
        adjudicator_rationale:
          type: string
          description: >
            If the agentic adjudicator deferred or hit its budget, its reasoning is
            surfaced here so the reviewer sees why.
