name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who needs it, and in what situation? For example "trekkers with no signal who …".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Moby to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: principles
    attributes:
      label: Moby's principles
      description: See CONTRIBUTING.md.
      options:
        - label: This keeps unverified reports clearly different from official warnings, and never shows a false all-clear.
          required: true
