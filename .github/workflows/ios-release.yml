# iOS release: signed App Store build → TestFlight; App Store review only after approval.
#
#   git tag v1.1.0 && git push origin v1.1.0          → build, sign, upload to TestFlight
#   Actions → iOS release → Run workflow, testflight  → same, from the chosen branch
#   Actions → iOS release → Run workflow, submit      → submit a TestFlight build you tested
#                                                       for App Store review ('app-store'
#                                                       environment: a reviewer approves first)
#
# Signing is cloud-managed: Xcode creates the distribution certificate and profile itself
# with the App Store Connect API key (-allowProvisioningUpdates), so no .p12 or profile
# is kept here. The key needs the Admin role for that (App Manager can upload but not sign).
#
# Needs the Apple Developer Program and the app created in App Store Connect
# (bundle id com.xlient.moby). Setup steps: README, "Releasing".
#
# Secrets (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_API_KEY_BASE64   base64 of the .p8 key (App Store Connect → Users and Access → Integrations)
#   APP_STORE_CONNECT_KEY_ID           its key ID
#   APP_STORE_CONNECT_ISSUER_ID        the issuer ID shown above the keys
#   APPLE_TEAM_ID                      10-character team ID (developer.apple.com → Membership)
#   GOOGLE_SERVICES_PLIST_BASE64       base64 of GoogleService-Info.plist (Firebase iOS app)
#   EXPO_PUBLIC_API_URL                shared with android-release.yml
# Variables: IOS_RELEASE_ENABLED=true turns on builds for tags; the EXPO_PUBLIC_FIREBASE_* and
#   Google client IDs are shared with the other workflows.
#
# Bluetooth mesh and SOS are Android-only for now (#83); the iOS build hides them.
name: iOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: testflight = build and upload; submit = send a TestFlight build to App Store review
        type: choice
        options: [testflight, submit]
        default: testflight
      version:
        description: "submit only: the version to submit, e.g. 1.0.0"
        type: string
        required: false
      build_number:
        description: "submit only: its TestFlight build number, e.g. 104"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to TestFlight
    # Tags build only once Apple signing is set up (repository variable IOS_RELEASE_ENABLED=true),
    # so releases don't show a failed iOS run before then. Manual runs always try.
    if: (github.event_name == 'push' && vars.IOS_RELEASE_ENABLED == 'true') || inputs.action == 'testflight'
    runs-on: macos-26   # Expo SDK 57 needs a newer Xcode than macos-15 has
    timeout-minutes: 90
    env:
      MOBY_PREBUILD_PLATFORM: ios
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PLIST: ${{ secrets.GOOGLE_SERVICES_PLIST_BASE64 }}
          API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          missing=()
          [ -n "$KEY" ]     || missing+=(APP_STORE_CONNECT_API_KEY_BASE64)
          [ -n "$KEY_ID" ]  || missing+=(APP_STORE_CONNECT_KEY_ID)
          [ -n "$ISSUER" ]  || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [ -n "$TEAM" ]    || missing+=(APPLE_TEAM_ID)
          [ -n "$PLIST" ]   || missing+=(GOOGLE_SERVICES_PLIST_BASE64)
          [ -n "$API_URL" ] || missing+=(EXPO_PUBLIC_API_URL)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::iOS release secrets not set: ${missing[*]}. See the header of ios-release.yml."
            exit 1
          fi

      - id: version
        name: Version
        run: |
          # App Store versions are numbers only (1.2.3): a tag's pre-release suffix is dropped
          # (v1.1.0-rc.1 → 1.1.0). Without a tag, app.json's version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; NAME="${NAME%%-*}";
          else NAME=$(node -p "require('./app.json').expo.version"); fi
          if ! [[ "$NAME" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then echo "::error::'$NAME' isn't a valid App Store version"; exit 1; fi
          # Every upload needs a higher build number than the last one.
          CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME ($CODE)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select the newest Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install
        run: npm ci

      - name: Firebase config and App Store Connect key
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICES_PLIST_BASE64 }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # Not in the repository (it identifies the production Firebase project).
          echo "$PLIST" | base64 --decode > GoogleService-Info.plist
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Prebuild (generate ios/ and install pods)
        env:
          MOBY_VERSION_NAME: ${{ steps.version.outputs.name }}
          MOBY_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          npx expo prebuild --platform ios --clean
          # prebuild reports a failed `pod install` but still exits 0: fail here instead.
          ls -d ios/*.xcworkspace >/dev/null 2>&1 || { echo "::error::pod install failed (no .xcworkspace)"; exit 1; }

      - name: Archive (signed for the App Store)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # Inlined into the JS bundle while archiving (same values as android-release.yml).
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          # Official builds prove themselves to the API with App Attest (App Check).
          EXPO_PUBLIC_APP_CHECK: "true"
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          # Full log to a file (uploaded on failure); here only the error lines.
          if ! xcodebuild archive -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
              -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Moby.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER" \
              DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic > xcodebuild.log 2>&1; then
            grep -nE "error:|fatal|\*\* ARCHIVE FAILED" xcodebuild.log | head -60
            exit 1
          fi

      - name: Upload to App Store Connect (TestFlight)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Add :method string app-store-connect" "$OPTS"
          $PB -c "Add :destination string upload" "$OPTS"
          $PB -c "Add :teamID string $TEAM" "$OPTS"
          $PB -c "Add :signingStyle string automatic" "$OPTS"
          $PB -c "Add :uploadSymbols bool true" "$OPTS"
          $PB -c "Add :manageAppVersionAndBuildNumber bool false" "$OPTS"
          if ! xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Moby.xcarchive" \
              -exportOptionsPlist "$OPTS" -exportPath "$RUNNER_TEMP/export" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER" >> xcodebuild.log 2>&1; then
            grep -nE "error:|fatal|EXPORT FAILED|Upload failed" xcodebuild.log | head -60
            exit 1
          fi
          {
            echo "### TestFlight"
            echo "Uploaded Moby ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})."
            echo "It appears in TestFlight once App Store Connect finishes processing (usually 10–30 min)."
            echo "To send it for review: Run workflow → action **submit**, version ${{ steps.version.outputs.name }}, build ${{ steps.version.outputs.code }}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" GoogleService-Info.plist

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

  submit:
    name: Submit for App Store review
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'submit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protected environment: a required reviewer approves before anything is submitted.
    environment: app-store
    steps:
      - name: Check inputs
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build_number }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::version must look like 1.0.0"; exit 1; }
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::build_number must be a number (see the TestFlight run's summary)"; exit 1; }

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Submit
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build_number }}
        run: |
          # fastlane's API-key file: the .p8 contents inline.
          ruby -rjson -rbase64 -e 'puts JSON.generate(key_id: ENV["KEY_ID"], issuer_id: ENV["ISSUER"],
            key: Base64.decode64(ENV["KEY"]), in_house: false)' > "$RUNNER_TEMP/asc.json"
          # Store listing, screenshots and privacy answers are edited in App Store Connect, not here.
          # Manual release: after approval, you press "Release" in App Store Connect.
          fastlane deliver --api_key_path "$RUNNER_TEMP/asc.json" --app_identifier com.xlient.moby \
            --app_version "$VERSION" --build_number "$BUILD" \
            --skip_binary_upload true --skip_metadata true --skip_screenshots true \
            --submit_for_review true --automatic_release false --force true \
            --precheck_include_in_app_purchases false \
            --submission_information '{"add_id_info_uses_idfa": false}'
          rm -f "$RUNNER_TEMP/asc.json"
