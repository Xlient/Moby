<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Full-bleed app icon (iOS/Expo icon.png): the OS applies its own corner mask. -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#174A6E"/>
      <stop offset="0.55" stop-color="#0E2A44"/>
      <stop offset="1" stop-color="#0B1F33"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="470" r="420" fill="url(#glow)"/>
  <g transform="translate(112 96) scale(0.78125)">
    <image href="moby-mark.svg" width="1024" height="1024"/>
  </g>
</svg>
